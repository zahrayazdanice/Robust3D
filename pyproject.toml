[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust3d"
version = "1.0.0"
description = "Classical surface reconstruction under noise, outliers, non-uniform density, and missing data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zahra" }]
keywords = ["3d-reconstruction", "point-cloud", "poisson", "ball-pivoting", "alpha-shapes"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "open3d>=0.19,<0.20",
  "dash>=3.2,<4",
  "plotly>=6.1,<7",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
robust3d = "robust3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robust3d = ["assets/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "C408", "ISC004", "RUF046"]

