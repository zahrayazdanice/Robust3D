datasets: [bunny, armadillo, torus]
points: 5000
evaluation_samples: 10000
seed: 7
preprocessing: [baseline, adaptive]
algorithms: [poisson, bpa, alpha]
poisson_depth: 8
scenarios:
  clean: {density: 1.0, noise_sigma: 0.0, missing_fraction: 0.0, outlier_fraction: 0.0}
  mild_noise: {density: 0.8, noise_sigma: 0.004, missing_fraction: 0.0, outlier_fraction: 0.0}
  heavy_noise: {density: 0.65, noise_sigma: 0.012, missing_fraction: 0.0, outlier_fraction: 0.0}
  sparse: {density: 0.30, noise_sigma: 0.002, missing_fraction: 0.0, outlier_fraction: 0.0}
  incomplete: {density: 0.70, noise_sigma: 0.002, missing_fraction: 0.30, outlier_fraction: 0.0}
  outliers: {density: 0.75, noise_sigma: 0.003, missing_fraction: 0.0, outlier_fraction: 0.15}
  combined: {density: 0.50, noise_sigma: 0.010, missing_fraction: 0.22, outlier_fraction: 0.10}
